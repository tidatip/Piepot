<style>
  /* ===== Default palette (original pastel) ===== */
  :root {
    --bg: #F3EFED;
    --surface: #FFFFFF;
    --surface-2: #FDDDD5;
    --line: #B3C0C0;
    --ink: #26312F;
    --ink-2: #5C6B69;
    --muted: #71807F;
    --accent: #517B7B;
    --accent-ink: #FFFFFF;
    --accent-soft: #CFDADA;
    --in: #946A27;
    --in-soft: #FAEFDF;
    --out: #D93725;
    --out-soft: #FEDAD6;
    --warn: #BD5715;
    --warn-soft: #F6E7DE;
    --shadow: 0 10px 30px rgba(38, 49, 47, .12);
    --overlay: rgba(38, 49, 47, .45);
    --focus: #619394;
    --hero-track: rgba(255,255,255,.25);
    --heading: var(--ink);
    --accent-2: #FDD8CF;
    --sage-ink: #6E7F4D;
    --sage-soft: #E9EDDC;
    --cherry: #B83A4B; --burgundy: #7E2938; --vanilla: #FFF7EE; --cocoa: #493336;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171F1E;
      --surface: #252C2C;
      --surface-2: #2E3534;
      --line: #434A49;
      --ink: #EFEFEF;
      --ink-2: #BEC0C0;
      --muted: #8B8F8E;
      --accent: #93B8B8;
      --accent-ink: #0F2323;
      --accent-soft: #2D4241;
      --in: #E8B86C;
      --in-soft: #45412F;
      --out: #FDADA4;
      --out-soft: #453B39;
      --warn: #F2B288;
      --warn-soft: #473F35;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
      --overlay: rgba(0, 0, 0, .6);
      --focus: #93B8B8;
      --hero-track: rgba(0,0,0,.15);
      --heading: var(--ink);
      --accent-2: #45413F;
      --sage-ink: #B5C48F;
      --sage-soft: #3C4331;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171F1E;
    --surface: #252C2C;
    --surface-2: #2E3534;
    --line: #434A49;
    --ink: #EFEFEF;
    --ink-2: #BEC0C0;
    --muted: #8B8F8E;
    --accent: #93B8B8;
    --accent-ink: #0F2323;
    --accent-soft: #2D4241;
    --in: #E8B86C;
    --in-soft: #45412F;
    --out: #FDADA4;
    --out-soft: #453B39;
    --warn: #F2B288;
    --warn-soft: #473F35;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    --overlay: rgba(0, 0, 0, .6);
    --focus: #93B8B8;
    --hero-track: rgba(0,0,0,.15);
    --heading: var(--ink);
    --accent-2: #45413F;
    --sage-ink: #B5C48F;
    --sage-soft: #3C4331;
  }


  /* ===== Cherry palette (PiePot Signature) ===== */
  :root[data-palette="cherry"] {
    /* PiePot Signature Palette */
    --cherry: #B83A4B; --burgundy: #7E2938; --blush: #E8A8B4; --vanilla: #FFF7EE;
    --peach: #F6D6C5; --honey: #D9A45B; --sage: #8C9A72; --cocoa: #493336;

    --bg: #FFF7EE;            /* Vanilla Cream — 60% */
    --surface: #FFFFFF;
    --surface-2: #F6D6C5;     /* Peach Cream — card / section bg */
    --line: #F0D8CC;
    --ink: #493336;           /* Cocoa Brown — main text */
    --ink-2: #6E5A5C;
    --muted: #8F7C7E;
    --heading: #7E2938;       /* Rose Burgundy */
    --accent: #B83A4B;        /* Cherry Red — primary / CTA */
    --accent-ink: #FFFFFF;
    --accent-soft: #F7DCE0;   /* blush tint */
    --accent-2: #E8A8B4;      /* Blush Pink — secondary */
    --in: #A87524;            /* Honey Gold, deepened for text */
    --in-soft: #FBEBD3;
    --honey: #D9A45B;
    --out: #7E2938;           /* Rose Burgundy */
    --out-soft: #F5DADE;
    --warn: #A5561B;
    --warn-soft: #FBE7D6;
    --sage-ink: #6B7A52;      /* Sage Leaf, deepened */
    --sage-soft: #E6EADC;
    --sage: #8C9A72;
    --fab-bg: linear-gradient(135deg, #B83A4B, #C9556A);
    --grad-page: linear-gradient(180deg, #FFF7EE 0%, #FFF7EE 55%, #FCEDE2 100%);
    --shadow: 0 10px 30px rgba(73, 51, 54, .14);
    --overlay: rgba(73, 51, 54, .45);
    --focus: #E8A8B4;
    --hero-track: rgba(255,255,255,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-palette="cherry"]:not([data-theme="light"]) {
      --bg: #241A1B;            /* Cocoa Brown, deepened */
      --surface: #332628;
      --surface-2: #3E2E31;
      --line: #4E3B3E;
      --ink: #F5E9E2;
      --ink-2: #D6C2BD;
      --muted: #A08A87;
      --heading: #F2B6C0;       /* Blush Pink */
      --accent: #F0AEBB;        /* Blush Pink — links / active */
      --accent-ink: #3B141B;
      --accent-soft: #4C3238;
      --accent-2: #E8A8B4;
      --hero-bg: #8E2C3D;       /* deep Cherry — comfortable at night */
      --hero-ink: #FFF0F2;
      --hero-track: rgba(0,0,0,.28);
      --fab-bg: #B83A4B;
      --fab-ink: #FFF0F2;
      --in: #E0B067;            /* Honey Gold */
      --in-soft: #453626;
      --out: #F09AAA;
      --out-soft: #4A2C31;
      --warn: #E9A96F;
      --warn-soft: #45362A;
      --sage-ink: #AEBE8E;      /* Sage Leaf */
      --sage-soft: #3B4433;
      --sage: #8C9A72;
      --honey: #D9A45B;
      --grad-page: linear-gradient(180deg, #241A1B 0%, #2A1E20 60%, #2F2225 100%);
      --shadow: 0 10px 30px rgba(0, 0, 0, .5);
      --overlay: rgba(0, 0, 0, .62);
      --start-bg: #241A1B;
      --start-ink: #F5E9E2;
      --start-ink2: #F2B6C0;
      --start-blob: radial-gradient(ellipse at 40% 50%, #3A2226 0%, #2E1E21 45%, rgba(36,26,27,0) 72%);
      --start-bg: #241A1B;
    --start-ink: #F5E9E2;
    --start-ink2: #F2B6C0;
    --start-blob: radial-gradient(ellipse at 40% 50%, #3A2226 0%, #2E1E21 45%, rgba(36,26,27,0) 72%);
    --focus: #F0AEBB;
    }
  }
  :root[data-palette="cherry"][data-theme="dark"] {
    --bg: #241A1B;            /* Cocoa Brown, deepened */
    --surface: #332628;
    --surface-2: #3E2E31;
    --line: #4E3B3E;
    --ink: #F5E9E2;
    --ink-2: #D6C2BD;
    --muted: #A08A87;
    --heading: #F2B6C0;       /* Blush Pink */
    --accent: #F0AEBB;        /* Blush Pink — links / active */
    --accent-ink: #3B141B;
    --accent-soft: #4C3238;
    --accent-2: #E8A8B4;
    --hero-bg: #8E2C3D;       /* deep Cherry — comfortable at night */
    --hero-ink: #FFF0F2;
    --hero-track: rgba(0,0,0,.28);
    --fab-bg: #B83A4B;
    --fab-ink: #FFF0F2;
    --in: #E0B067;            /* Honey Gold */
    --in-soft: #453626;
    --out: #F09AAA;
    --out-soft: #4A2C31;
    --warn: #E9A96F;
    --warn-soft: #45362A;
    --sage-ink: #AEBE8E;      /* Sage Leaf */
    --sage-soft: #3B4433;
    --sage: #8C9A72;
    --honey: #D9A45B;
    --grad-page: linear-gradient(180deg, #241A1B 0%, #2A1E20 60%, #2F2225 100%);
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --overlay: rgba(0, 0, 0, .62);
    --focus: #F0AEBB;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    /* Thai: Prompt · English: SF Pro (Apple system font) — switched by data-lang */
    font-family: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  body[data-lang="th"] { font-family: "Prompt", "Noto Sans Thai", "Sukhumvit Set", system-ui, sans-serif; font-weight: 300; }
  body[data-lang="th"] b, body[data-lang="th"] strong, body[data-lang="th"] .name, body[data-lang="th"] .t, body[data-lang="th"] .btn, body[data-lang="th"] .amt, body[data-lang="th"] .net, body[data-lang="th"] .chip, body[data-lang="th"] .seg button, body[data-lang="th"] .choices button, body[data-lang="th"] .stat .v, body[data-lang="th"] .cat .a { font-weight: 500; }
  body[data-lang="en"] { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: -.005em; }
  .num { font-family: inherit; font-variant-numeric: tabular-nums; }
  h1, h2, h3 { font-family: inherit; margin: 0; text-wrap: balance; color: var(--heading); }
  body[data-lang="th"] h1, body[data-lang="th"] h2, body[data-lang="th"] h3, body[data-lang="th"] .hero .big { font-weight: 600; }
  body[data-lang="en"] h1, body[data-lang="en"] h2, body[data-lang="en"] .hero .big { font-weight: 700; letter-spacing: -.02em; }
  body[data-lang="en"] h3 { font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input, select, textarea { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::placeholder { color: var(--muted); }

  /* ===== My Slice hero: solid gold block, sibling of the teal fund hero ===== */
  /* honey gold straight from the palette - same in light and dark, with cocoa text on top */
  :root { --mine-bg: #E5B569; --mine-ink: #2E2412; --mine-rule: rgba(0,0,0,.18); }
  :root[data-palette="cherry"] { --mine-bg: #D9A45B; --mine-ink: #3A2A1E; --mine-rule: rgba(0,0,0,.2); }

  .app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

  /* ---------- start screen ---------- */
  .start, .start .go, .start .alt { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
  .start { position: fixed; inset: 0; z-index: 200; background: var(--start-bg, var(--vanilla)); color: var(--start-ink, var(--cocoa)); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); text-align: center; overflow: hidden; transition: opacity .35s ease, visibility .35s; }
  .start.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .start .blob { position: absolute; left: -30%; right: -30%; top: 44%; height: 46%; background: var(--start-blob, radial-gradient(ellipse at 40% 50%, #F5CFC9 0%, #F8DED6 45%, rgba(246,214,197,0) 72%)); z-index: 0; }
  .start .dots i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #E7A8AE; opacity: .75; }
  .start > * { position: relative; z-index: 1; }
  .start::before { content: ""; flex: 382 1 0; }  /* golden ratio: top space 38.2% */
  .start::after { content: ""; flex: 618 1 0; }   /* bottom space 61.8% */
  .start .brand { margin: 0 0 30px; }
  .start .start-actions { margin-top: 34px; }
  .start .brand svg.cherry { width: 54px; height: 54px; }

  .start .tag { font-family: "Playfair Display", "Prompt", Georgia, serif; font-style: italic; font-size: 17px; color: var(--start-ink2, var(--burgundy)); opacity: .85; margin-top: 16px; line-height: 1.5; }
  .start .pie { width: min(78vw, 320px); height: auto; margin: 0; display: block; filter: drop-shadow(0 16px 22px rgba(126,41,56,.20)); }
  .start .start-actions { width: 100%; max-width: 360px; }
  .start .go { display: block; width: 100%; padding: 16px; border-radius: 999px; background: var(--fab-bg, linear-gradient(135deg, #B83A4B, #C9556A)); color: var(--fab-ink, #fff); font-weight: 600; font-size: 17px; box-shadow: 0 10px 24px rgba(184,58,75,.28); }
  .start .go:active { transform: scale(.985); }
  :root:not([data-palette="cherry"]) .start { background: #F3EFED; }
  :root:not([data-palette="cherry"]) .start .blob { background: radial-gradient(ellipse at 40% 50%, #FDD8CF 0%, #FBE6DF 45%, rgba(253,216,207,0) 72%); }
  :root:not([data-palette="cherry"]) .start .tag, :root:not([data-palette="cherry"]) .start .alt { color: #517B7B; }
  :root:not([data-palette="cherry"]) .start .wordmark { background-color: #517B7B; }
  :root:not([data-palette="cherry"]) .start .go { background: #517B7B; box-shadow: 0 10px 24px rgba(81,123,123,.28); }
  :root:not([data-palette="cherry"]) .start .dots i { background: #C3D1D1; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start { background: #171F1E; }
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .blob { background: radial-gradient(ellipse at 40% 50%, #23302F 0%, #1C2625 45%, rgba(23,31,30,0) 72%); }
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .tag, :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .alt { color: #93B8B8; }
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .wordmark { background-color: #93B8B8; }
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .go { background: #6E9B9B; color: #0F2323; }
    :root:not([data-palette="cherry"]):not([data-theme="light"]) .start .dots i { background: #3A4746; }
  }
  .start .alt { display: block; width: 100%; margin-top: 14px; padding: 8px; font-size: 15px; font-weight: 500; color: var(--start-ink2, var(--burgundy)); }

  .pal-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .pal-seg button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 500; }
  .pal-seg button.on { border-color: var(--accent); background: var(--accent-soft); }
  .pal-seg .sw { display: flex; gap: 3px; } .pal-seg .sw i { width: 14px; height: 14px; border-radius: 50%; display: block; }


  /* ---- Cherry palette: gradients + sage secondary accent ---- */
  :root[data-palette="cherry"] body { background: var(--grad-page) fixed, var(--bg); }
  :root[data-palette="cherry"] .entry.src-card .ic, :root[data-palette="cherry"] .entry.deposit.src-card .ic { background: var(--sage-soft); color: var(--sage-ink); }
  :root[data-palette="cherry"] .pill.src-card { background: var(--sage-soft); color: var(--sage-ink); }
  :root[data-palette="cherry"] .entry.src-card .amt { color: var(--sage-ink); }
  :root[data-palette="cherry"] .cat .bar i { background: linear-gradient(90deg, #B83A4B, #E8A8B4); }
  :root[data-palette="cherry"] .nav .fab { background: var(--fab-bg, var(--accent)); color: var(--fab-ink, var(--accent-ink)); }

  .grp-item .entry { padding-left: 28px; }
  .grp-item .entry .ic { width: 30px; height: 30px; font-size: 13px; }
  .grp-arrow { font-size: 11px; opacity: .6; margin-left: 2px; }
  .entry.grp-open { background: var(--surface-2); }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 2px 10px; gap: 10px; }
  .top h1 { font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .top .rate { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .top .lang { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); flex: 0 0 auto; }

  .hero {
    background: var(--hero-bg, var(--accent));
    color: var(--hero-ink, var(--accent-ink));
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
  }
  .hero .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .78; font-weight: 500; }
  .hero .big { font-size: 40px; line-height: 1.1; margin-top: 4px; }
  .hero .big small { font-size: 18px; font-weight: 500; opacity: .85; letter-spacing: .04em; }
  .hero .thb { font-size: 15px; opacity: .85; margin-top: 2px; }
  .hero .bar { height: 8px; border-radius: 6px; background: var(--hero-track); margin-top: 14px; overflow: hidden; }
  .hero .bar i { display: block; height: 100%; background: var(--accent-ink); opacity: .85; border-radius: 6px; width: 0; transition: width .4s ease; }
  .hero .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; opacity: .9; }
  .hero .src-lbl-row { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--hero-track); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; opacity: .78; font-weight: 500; }
  .hero .src-row { margin-top: 3px; }
  /* cash = warm gold tone, card = teal tone (same palette as the rest of the app) */
  .entry.src-cash .ic, .entry.deposit.src-cash .ic { background: var(--in-soft); color: var(--in); }
  .entry.src-card .ic, .entry.deposit.src-card .ic { background: var(--accent-soft); color: var(--accent); }
  .pill.src-cash { background: var(--in-soft); color: var(--in); }
  .pill.src-card { background: var(--accent-soft); color: var(--accent); }
  .hero.mine { background: var(--mine-bg); color: var(--mine-ink); border: 0; box-shadow: var(--shadow); }
  .hero.mine .split { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--mine-rule); }
  .hero.mine .split .row { margin-top: 5px; font-size: 14px; opacity: .92; }
  .hero.mine .split .row:first-child { margin-top: 0; }
  .hero.mine .split .row b { font-weight: 600; opacity: 1; }
  .hero.mine .split #mySrcRow { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--mine-rule); font-size: 13px; opacity: .8; }
  .hero.mine .split #mySrcRow b { font-weight: 500; }
  #myCats .cat .bar i { background: var(--in); }
  body.v-mine #hero { display: none; }
  #mePickCard { margin-bottom: 16px; }
  .fundlink { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); font-size: 13px; text-align: left; }
  .fundlink b { margin-left: auto; color: var(--accent); font-weight: 600; font-size: 14px; }
  .fundlink .chev { color: var(--muted); font-size: 17px; line-height: 1; margin-left: -2px; }
  .fundlink:active { background: var(--surface-2); }
  .mine-note { font-size: 12px; color: var(--muted); margin: 10px 4px 0; line-height: 1.55; }
  .mine-note + .mine-note { margin-top: 7px; }
  .hero.low { background: var(--warn); }
  .hero.neg { background: var(--out); }

  /* ---------- tabs / views ---------- */
  .view { display: none; padding-top: 14px; }
  .view.on { display: block; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 8px; }
  .section-h h2 { font-size: 15px; color: var(--ink-2); }
  .section-h .link { font-size: 13px; color: var(--accent); font-weight: 500; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .card + .card { margin-top: 10px; }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .stat .v small { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
  .net small, .amt small { font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
  .stat .s { font-size: 12px; color: var(--muted); }
  .stat.in .v { color: var(--in); }
  .stat.out .v { color: var(--out); }

  /* ---------- people ---------- */
  .person { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .person > div:nth-child(2) { min-width: 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; color: #fff; }
  .person .name { font-weight: 600; }
  .person .meta { font-size: 12px; color: var(--muted); }
  .person .net { text-align: right; font-weight: 600; font-size: 16px; }
  .person .net .t { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .pos { color: var(--in); } .negv { color: var(--out); }
  /* Slice Status: name + net on one line, the three figures full width underneath */
  .person.slice { grid-template-columns: 36px 1fr; align-items: center; gap: 10px; padding: 10px 14px; }
  .person.slice .slice-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .person.slice .net { font-size: 16px; flex: 0 0 auto; text-align: right; }
  .person.slice .net .t { display: inline; margin-right: 5px; }
  .person.slice .meta { line-height: 1.32; margin-top: 0; }
  .person.slice .meta:first-of-type { margin-top: 4px; }

  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; line-height: 1.5; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }

  /* ---------- category breakdown ---------- */
  .cats { padding: 6px 14px 10px; }
  .cat { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 8px 0; align-items: center; }
  .cat .n { font-size: 14px; }
  .cat .a { font-size: 14px; font-weight: 600; }
  .cat .bar { grid-column: 1 / -1; height: 5px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .cat .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  /* ---------- entries list ---------- */
  .day { margin-top: 14px; }
  .day > .card { overflow: hidden; }  /* clip square swipe rows to the card's rounded corners */
  .day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px 6px; font-weight: 500; }
  .entry { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .entry:last-child { border-bottom: 0; }
  .entry:active { background: var(--surface-2); }
  .entry .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
  .entry.deposit .ic { background: var(--in-soft); color: var(--in); }
  .entry .ic svg { width: 20px; height: 20px; }
  .entry > span:nth-child(2) { min-width: 0; }
  .entry .t { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .m { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .amt { text-align: right; font-weight: 600; font-size: 15px; }
  .entry .amt .b { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .entry.src-cash .amt { color: var(--in); }
  .entry.src-card .amt { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
  .empty b { display: block; color: var(--ink-2); font-size: 17px; margin-bottom: 4px; }

  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ---------- swipe-to-delete & multi-select ---------- */
  .list-top { display: flex; gap: 8px; align-items: flex-start; }
  .list-top .filters { flex: 1; min-width: 0; }
  #entries .card { overflow: hidden; }
  .swipe-wrap { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .swipe-wrap:last-child { border-bottom: 0; }
  .swipe-wrap .entry { border-bottom: 0; position: relative; z-index: 1; background: var(--surface); transition: transform .22s ease; }
  .swipe-del { position: absolute; top: 0; right: 0; bottom: 0; width: 84px; background: var(--out); color: #fff; font-weight: 600; font-size: 14px; z-index: 0; }
  .entry .ic.ck, .entry.deposit .ic.ck { width: 26px; height: 26px; margin: 7px auto; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: transparent; font-size: 15px; font-weight: 700; }
  .entry .ic.ck.on, .entry.deposit .ic.ck.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .selbar { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 448px; margin: 0 auto; z-index: 25; display: none; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
  .selbar.on { display: flex; }
  .selbar .c { font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .selbar .btn.danger { flex: 0 0 auto; padding: 10px 16px; }

  /* ---------- bottom nav ---------- */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: end; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; white-space: nowrap; color: var(--muted); padding: 6px 0 4px; font-weight: 500; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button.on { color: var(--accent); }
  .nav .fab { margin: -26px auto 0; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); }
  .nav .fab svg { width: 28px; height: 28px; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 30; display: none; }
  .scrim.on { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 31;
    background: var(--surface); border-radius: 20px 20px 0 0;
    max-width: 520px; margin: 0 auto;
    max-height: min(92vh, calc(var(--vvh, 100vh) - 10px));
    --sheet-h: min(88vh, calc(var(--vvh, 100vh) - 10px));
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;
  }
  .sheet.on { transform: translateY(0); visibility: visible; transition-delay: 0s; }
  body.kb .sheet { padding-bottom: 14px; }
  body.sheet-open { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .sheet, .hero .bar i { transition: none; } }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
  .sheet h2 { font-size: 18px; margin-bottom: 10px; }

  /* ---------- share preview ---------- */
  .share-prev { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; max-height: 56vh; overflow-y: auto; font-size: 13.5px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
  .share-prev .sp-title { font-weight: 600; font-size: 14.5px; }
  .share-prev .sp-line { color: var(--ink-2); overflow-wrap: break-word; }
  .share-prev .sp-line.in { color: var(--in); }
  .share-prev .sp-line.ex { color: var(--ink-2); }
  .share-prev .sp-sec { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .share-prev .sp-day { font-weight: 600; color: var(--accent); margin: 10px 0 2px; }
  .share-prev .sp-day small { font-weight: 500; color: var(--muted); }
  .share-prev .sp-day:first-child { margin-top: 0; }

  /* ---------- trip history ---------- */
  .hist-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .hist-row:last-child { border-bottom: 0; }
  .hist-main { text-align: left; min-width: 0; }
  .hist-main .t { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-main .m { display: block; font-size: 12px; color: var(--muted); }
  .hist-act { flex: 0 0 auto; font-size: 12.5px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 6px 11px; border-radius: 999px; }
  .hist-act.danger { color: var(--out); background: var(--out-soft); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { padding: 9px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button.on.dep { color: var(--in); }
  .seg button.on.exp { color: var(--out); }
  .seg.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .seg.four button { padding: 9px 4px; font-size: 13px; }
  .rate-row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; margin-top: 10px; font-weight: 500; }
  .rate-row input { padding: 9px 10px; text-align: right; }
  body.base-thb #rateBlock { display: none; }
  body.base-thb .hero .thb, body.base-thb .stat .s { display: none; }

  .field { margin-top: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; letter-spacing: .02em; }
  .amount-wrap { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
  .amount { width: 100%; font-size: 32px; font-weight: 600; padding: 7px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); text-align: right; }
  .cur { display: grid; grid-auto-rows: 1fr; gap: 4px; }
  .cur button { padding: 0 12px; min-width: 60px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted); background: var(--surface); }
  #fPlus { font-size: 18px; line-height: 1; color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); min-height: 34px; }
  .cur button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .conv { font-size: 13px; color: var(--muted); text-align: right; margin-top: 6px; min-height: 1.2em; }
  .txt { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 16px; }
  /* iOS sizes date inputs from their own content and ignores width:100% unless appearance is reset */
  input[type="date"].txt { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; min-width: 0; line-height: 1.25; color: var(--ink); }
  input[type="date"].txt::-webkit-date-and-time-value { text-align: left; margin: 0; }
  input[type="date"].txt::-webkit-calendar-picker-indicator { margin-left: auto; opacity: .6; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .choices button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .choices .dot { width: 10px; height: 10px; border-radius: 50%; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .short { display: none; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--warn-soft); border: 1px solid transparent; }
  .short.on { display: block; }
  .short .short-t { font-size: 13px; font-weight: 600; color: var(--warn); margin-bottom: 8px; }
  .short label { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  #sheet { padding-bottom: 0; height: var(--sheet-h); display: flex; flex-direction: column; }
  #sheet > .field:last-of-type { margin-bottom: 18px; }
  #sheet > .actions {
    position: sticky; bottom: 0; z-index: 3; margin: auto -18px 0; flex: 0 0 auto;
    padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  body.kb #sheet > .actions { padding-bottom: 11px; }
  .nw { white-space: nowrap; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; font-weight: 600; font-size: 15px; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface-2); color: var(--ink-2); }
  .btn.danger { background: var(--out-soft); color: var(--out); flex: 0 0 auto; padding: 13px 16px; }
  .btn.small { flex: 0 0 auto; padding: 8px 14px; font-size: 13px; }

  /* ---------- settings ---------- */
  .set { padding: 14px; }
  .set + .set { border-top: 1px solid var(--line); }
  .set h3 { font-size: 14px; margin-bottom: 8px; }
  .set p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .members-edit { display: grid; gap: 8px; }
  .members-edit .m { display: grid; grid-template-columns: 30px 1fr 36px; gap: 10px; align-items: center; }
  .members-edit .avatar { width: 30px; height: 30px; font-size: 13px; }
  .members-edit .rm { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); background: var(--surface-2); }
  .members-edit .rm:disabled { opacity: .35; cursor: not-allowed; }
  .members-edit .rm svg { width: 16px; height: 16px; }
  textarea.txt { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

  .toast { position: fixed; left: 50%; max-width: calc(100% - 32px); text-align: center; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 40; display: none; box-shadow: var(--shadow); }
  .toast.on { display: block; }
  .toast button { margin-left: 12px; color: var(--accent); font-weight: 700; }
  :root[data-theme="dark"] .toast button { color: var(--accent); }
  .seg.curwrap { display: grid; grid-template-columns: repeat(5, 1fr); }
  .seg.curwrap button { padding: 9px 2px; font-size: 13.5px; }
  .seg.curwrap button.addcur { grid-column: 1 / -1; color: var(--accent); border: 1px dashed var(--line); font-size: 14px; }
  .rate-row.cur5 { grid-template-columns: 76px auto auto 1fr auto; gap: 8px; }

  .curlist { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .curlist .row { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
  .curlist .row b { font-size: 14px; min-width: 46px; }
  .curlist .row span { font-size: 12.5px; color: var(--muted); flex: 1; }
  .curlist .row button { color: var(--out); padding: 4px 8px; font-size: 13px; }
  .curlist .row button:disabled { opacity: .35; }
  .imgopt { display: flex; align-items: center; gap: 8px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .imgopt input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .imgview { position: fixed; inset: 0; z-index: 70; background: rgba(20, 14, 12, .55); display: none; align-items: flex-start; justify-content: center; overflow: auto; padding: 24px 14px 34px; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }

  .imgview-in { width: min(440px, 100%); background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .imgview-in img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .imgview-in .hint { text-align: center; margin: 10px 0 2px; }
</style>

<div class="app">
  <header class="top">
    <h1 id="tripName"></h1>
    <button class="rate num" id="rateBtn"><span id="rateShow"></span></button>
    <button class="lang" id="langBtn" aria-label="Switch language"></button>
  </header>

  <section class="hero" id="hero">
    <div class="lbl"><span data-i="balance"></span></div>
    <div class="big num"><span id="balJPY">0</span> <small class="cc"></small></div>
    <div class="thb num">≈ <span id="balTHB">0</span> THB</div>
    <div class="bar"><i id="balBar"></i></div>
    <div class="row num"><span><span data-i="fundIn"></span> <span id="fundIn">0</span> <span class="cc"></span></span><span><span data-i="fundOut"></span> <span id="fundOut">0</span> <span class="cc"></span></span></div>
    <div class="row src-lbl-row" id="srcLblRow" style="display:none"><span data-i="srcRemaining"></span></div>
    <div class="row num src-row" id="srcRow" style="display:none"><span><span data-i="srcCash"></span> <span id="srcCashBal">0</span> <span class="cc"></span></span><span><span data-i="srcCard"></span> <span id="srcCardBal">0</span> <span class="cc"></span></span></div>
  </section>

  <!-- ===== summary ===== -->
  <main id="v-sum" class="view on">
    <div class="stats">
      <div class="stat out"><div class="k"><span data-i="spentAll"></span></div><div class="v num"><span id="spentAll">0</span> <small class="cc"></small></div><div class="s num">≈ <span id="spentAllTHB">0</span> THB</div></div>
      <div class="stat"><div class="k"><span data-i="perHead"></span></div><div class="v num"><span id="perHead">0</span> <small class="cc"></small></div><div class="s num">≈ <span id="perHeadTHB">0</span> THB</div></div>
    </div>

    <div class="section-h"><h2 data-i="whereEveryone"></h2><span class="link" id="explainBtn" data-i="howCalc"></span></div>
    <div class="card" id="people"></div>
    <div class="hint" id="settleHint" style="margin: 8px 4px 0"></div>

    <div class="section-h"><h2 data-i="atTripEnd"></h2></div>
    <div class="card" id="settle"></div>

    <div class="section-h"><h2 data-i="spentOn"></h2><span class="hint" id="catTotalCount"></span></div>
    <div class="card cats" id="cats"></div>
  </main>

  <!-- ===== entries ===== -->
  <main id="v-list" class="view">
    <div class="list-top">
      <div class="filters" id="filters"></div>
      <button class="chip" id="selectBtn"></button>
    </div>
    <div id="entries"></div>
  </main>

  <!-- ===== my slice ===== -->
  <main id="v-mine" class="view">
    <button class="fundlink" id="fundLink"><span data-i="backToFund"></span><b class="num" id="fundLinkBal">0</b><span class="chev">&#8250;</span></button>
    <div class="card" id="mePickCard" style="display:none">
      <div class="set">
        <h3 data-i="meIs"></h3>
        <p data-i="meHint"></p>
        <div class="choices" id="mePick"></div>
      </div>
    </div>

    <section class="hero mine">
      <div class="lbl"><span data-i="myTripTotal"></span></div>
      <div class="big num"><span id="myTotal">0</span> <small class="cc"></small></div>
      <div class="thb num">&#8776; <span id="myTotalTHB">0</span> THB</div>
      <div class="split">
        <div class="row num"><span data-i="myShare"></span><b id="myShareV">0</b></div>
        <div class="row num"><span data-i="myOwn"></span><b id="myOwnV">0</b></div>
        <div class="row num" id="mySrcRow" style="display:none"><span data-i="paidWith"></span><b><span data-i="srcCash"></span> <span id="mySrcCash">0</span> · <span data-i="srcCard"></span> <span id="mySrcCard">0</span></b></div>
      </div>
    </section>
    <p class="mine-note" id="mineNote"></p>
    <p class="mine-note" id="minePrivate"></p>

    <div class="section-h" id="myCatHead"><h2 data-i="myByCat"></h2><span class="hint" id="myCatCount"></span></div>
    <div class="card cats" id="myCats"></div>

    <div class="section-h"><h2 data-i="myEntries"></h2><button class="chip" id="mineSelectBtn"></button></div>
    <div id="mineEntries"></div>
  </main>

  <!-- ===== settings ===== -->
  <main id="v-set" class="view">
    <div class="card">
      <div class="set">
        <h3 data-i="tripName"></h3>
        <input class="txt" id="setTrip" data-ph="tripPh">
      </div>
      <div class="set">
        <h3><span data-i="members"></span> <span class="hint" id="memberCount"></span></h3>
        <p data-i="membersHint"></p>
        <div class="members-edit" id="membersEdit"></div>
        <div class="actions" style="margin-top:10px">
          <button class="btn ghost small" id="addMember" data-i="addMember"></button>
        </div>
      </div>
      <div class="set" id="meBlock">
        <h3 data-i="meIs"></h3>
        <p data-i="meHint"></p>
        <div class="choices" id="meSeg"></div>
      </div>
      <div class="set">
        <h3 data-i="baseCur"></h3>
        <p data-i="baseCurHint"></p>
        <div class="seg curwrap" id="baseSeg"></div>
        <div id="rateBlock">
          <h3 style="margin-top:14px" data-i="rates"></h3>
          <p data-i="ratesHint"></p>
          <div class="rate-row"><span class="num" id="rateLeft"></span><span>=</span><input class="txt num" id="rateBase" type="number" inputmode="decimal" step="0.01" min="0.01"><span>THB</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="set">
        <p data-i="shareHint"></p>
        <div class="actions" style="margin-top:8px">
          <button class="btn ghost" id="shareSummary" data-i="shareSummary"></button>
        </div>
      </div>
      <div class="set">
        <p data-i="newTripHint"></p>
        <div class="actions" style="margin-top:8px">
          <button class="btn ghost" id="newTripBtn" data-i="newTrip"></button>
        </div>
      </div>

  let filter = 'all';
  // ---------- multi-select & swipe-to-delete state ----------
  let selMode = false;
  const selIds = new Set();
  let swOpen = null;
  function closeSw() { if (swOpen) { const r = swOpen.querySelector('.entry'); if (r) r.style.transform = ''; swOpen.classList.remove('sw-open'); swOpen = null; } }
  function deleteEntries(ids) {
    if (window.__ppMember) { toast(t('shViewerToast')); return; }
    const removed = [];
    S.entries = S.entries.filter(e => { if (ids.has(e.id)) { removed.push(e); return false; } return true; });
    if (!removed.length) return;
    save(); renderAll();
    toast(removed.length > 1 ? t('deletedNToast', removed.length) : t('deletedToast'), () => { S.entries.push(...removed); save(); renderAll(); });
  }
  function bindSwipe(w) {
    const row = w.querySelector('.entry');
    let sx = 0, sy = 0, dx = 0, drag = false, horiz = null;
    w.addEventListener('touchstart', (ev) => { const p = ev.touches[0]; sx = p.clientX; sy = p.clientY; dx = 0; horiz = null; drag = true; row.style.transition = 'none'; if (swOpen && swOpen !== w) closeSw(); }, { passive: true });
    w.addEventListener('touchmove', (ev) => {
      if (!drag) return;
      const p = ev.touches[0]; const mx = p.clientX - sx, my = p.clientY - sy;
      if (horiz === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) horiz = Math.abs(mx) > Math.abs(my);
      if (!horiz) return;
      const base = w.classList.contains('sw-open') ? -84 : 0;
      dx = Math.max(-84, Math.min(0, base + mx));
      row.style.transform = `translateX(${dx}px)`;
    }, { passive: true });
    w.addEventListener('touchend', () => {
      if (!drag) return;
      drag = false; row.style.transition = '';
      if (horiz && dx < -42) { row.style.transform = 'translateX(-84px)'; w.classList.add('sw-open'); swOpen = w; }
      else { row.style.transform = ''; w.classList.remove('sw-open'); if (swOpen === w) swOpen = null; }
      if (horiz) { w.dataset.swiped = '1'; setTimeout(() => { delete w.dataset.swiped; }, 350); }
    });
  }
  function renderEntries() {
    $('selectBtn').textContent = selMode ? t('cancel') : t('select');

    $('selDelete').textContent = t('deleteSel', selIds.size);
    $('selDelete').disabled = !selIds.size;
    const counts = {};
    S.entries.forEach(e => { const k = e.type === 'deposit' ? 'deposit' : e.cat; counts[k] = (counts[k] || 0) + 1; });
    const chips = [{ id: 'all', label: t('all') }, { id: 'deposit', label: t('typeDeposit') }, ...CATS.map(c => ({ id: c.id, label: catName(c) }))].filter(c => c.id === 'all' || counts[c.id]);
    $('filters').innerHTML = chips.map(c => `<button class="chip ${filter === c.id ? 'on' : ''}" data-f="${c.id}">${c.label}${c.id !== 'all' ? ` ${counts[c.id]}` : ''}</button>`).join('');
    $('filters').querySelectorAll('button').forEach(b => b.onclick = () => { filter = b.dataset.f; renderEntries(); });

    let list = S.entries.filter(e => filter === 'all' || (filter === 'deposit' ? e.type === 'deposit' : e.type === 'expense' && e.cat === filter));
    list = list.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
    if (!list.length) { $('entries').innerHTML = `<div class="empty"><b>${t('emptyList')}</b>${t('emptyListHint')}</div>`; return; }
    const days = {};
    // group "everyone" deposits (same batch, one per current member) into a single row
    const gkey = (e) => e.type !== 'deposit' ? null : (e.grp ? 'g:' + e.grp : `l:${e.date}|${e.note || ''}|${e.orig}|${e.cur}|${e.src || ''}`);
    const gmap = {};
    list.forEach(e => { const k = gkey(e); if (k) (gmap[k] = gmap[k] || []).push(e); });
    const memberIds = S.members.map(m => m.id).sort().join(',');
    const isGroup = (k) => { const es = gmap[k]; return es && es.length === S.members.length && es.length > 1 && es.map(e => e.by).sort().join(',') === memberIds; };
    const seen = new Set();
    const items = [];
    list.forEach(e => {
      const k = gkey(e);
      if (k && isGroup(k)) { if (seen.has(k)) return; seen.add(k); items.push({ group: k, es: gmap[k], date: e.date }); }
      else items.push({ e, date: e.date });
    });
    items.forEach(it => (days[it.date] = days[it.date] || []).push(it));
    const rowWrap = (it) => {
      if (it.group) {
        const ids = it.es.map(e => e.id).join(',');
        const open = openGrps.has(it.group);
        const inner = groupRow(it.group, it.es, open) + (open ? it.es.map(e => `<div class="grp-item">${selMode ? entryRow(e) : `<div class="swipe-wrap"><button class="swipe-del" data-del="${e.id}">${t('delete')}</button>${entryRow(e)}</div>`}</div>`).join('') : '');
        return selMode ? inner : `<div class="swipe-wrap"><button class="swipe-del" data-del="${ids}">${t('delete')}</button>${groupRow(it.group, it.es, open)}</div>` + (open ? it.es.map(e => `<div class="grp-item"><div class="swipe-wrap"><button class="swipe-del" data-del="${e.id}">${t('delete')}</button>${entryRow(e)}</div></div>`).join('') : '');
      }
      const e = it.e;
      return selMode ? entryRow(e) : `<div class="swipe-wrap"><button class="swipe-del" data-del="${e.id}">${t('delete')}</button>${entryRow(e)}</div>`;
    };
    $('entries').innerHTML = Object.keys(days).sort().reverse().map(d => {
      const its = days[d];
      const es = its.flatMap(it => it.group ? it.es : [it.e]);
      const spent = es.filter(e => e.type === 'expense').reduce((a, e) => a + amt(e), 0);
      return `<div class="day"><div class="day-h"><span>${niceDate(d)}</span><span class="num">${spent ? t('daySpent') + ' ' + money(spent) : ''}</span></div><div class="card">${its.map(rowWrap).join('')}</div></div>`;
    }).join('');
    $('entries').querySelectorAll('.entry').forEach(b => b.onclick = () => {
      const w = b.closest('.swipe-wrap');

      if (b.dataset.grp) {
        const ids = b.dataset.ids.split(',');
        if (selMode) { const allOn = ids.every(id => selIds.has(id)); ids.forEach(id => allOn ? selIds.delete(id) : selIds.add(id)); renderEntries(); return; }
        if (openGrps.has(b.dataset.grp)) openGrps.delete(b.dataset.grp); else openGrps.add(b.dataset.grp);
        renderEntries(); return;
      }
      if (selMode) { const id = b.dataset.id; if (selIds.has(id)) selIds.delete(id); else selIds.add(id); renderEntries(); return; }
      openSheet(b.dataset.id);
    });
    $('entries').querySelectorAll('.swipe-del').forEach(d => d.onclick = () => { closeSw(); deleteEntries(new Set(d.dataset.del.split(','))); });
    if (!selMode) $('entries').querySelectorAll('.swipe-wrap').forEach(bindSwipe);
  }
  $('selectBtn').onclick = () => { selMode = !selMode; selIds.clear(); closeSw(); renderEntries(); };
  $('selDelete').onclick = () => {
    if (!selIds.size) return;
    if (!confirm(t('deleteNConfirm', selIds.size))) return;
    const ids = new Set(selIds); selMode = false; selIds.clear();
    deleteEntries(ids);
  };
  const openGrps = new Set();
  function groupRow(key, es, open) {
    const e = es[0];
    const total = es.reduce((a, x) => a + amt(x), 0);
    const allSel = selMode && es.every(x => selIds.has(x.id));
    const src = e.src === 'card' ? 'src-card' : e.src === 'cash' ? 'src-cash' : '';
    const sub = [e.cur !== S.base ? moneyC(e.orig * es.length, e.cur) : '', e.cur === 'THB' ? '' : approx(total)].filter(Boolean).join(' · ');
    return `<button class="entry deposit grp ${src} ${open ? 'grp-open' : ''}" data-grp="${key}" data-ids="${es.map(x => x.id).join(',')}">${selMode ? `<span class="ic ck ${allSel ? 'on' : ''}">\u2713</span>` : `<span class="ic">${svgIcon(GROUP_ICON)}</span>`}<span><span class="t">${esc(e.note || t('depositDefault'))}</span><span class="m">${t('putIn', t('everyone'))} · ${es.length} × ${fmt(amt(e))}${e.src ? ` <span class="pill src-${e.src}">${t(e.src === 'card' ? 'srcCard' : 'srcCash')}</span>` : ''} <span class="grp-arrow">${open ? '\u25B4' : '\u25BE'}</span></span></span><span class="amt num">+${fmt(total)} <small>${S.base}</small><span class="b">${sub}</span></span></button>`;
  }
  const subAmt = (e) => [e.cur !== S.base ? moneyC(e.orig, e.cur) : '', e.cur === 'THB' ? '' : approx(amt(e))].filter(Boolean).join(' · ');
  function entryRow(e) {

      return `<button class="entry deposit ${e.src === 'card' ? 'src-card' : e.src === 'cash' ? 'src-cash' : ''}" data-id="${e.id}">${selMode ? `<span class="ic ck ${selIds.has(e.id) ? 'on' : ''}">\u2713</span>` : `<span class="ic">${svgIcon(DEPOSIT_ICON)}</span>`}<span><span class="t">${esc(e.note || t('depositDefault'))}</span><span class="m">${t('putIn', esc(mname(e.by)))}${e.src ? ` <span class="pill src-${e.src}">${t(e.src === 'card' ? 'srcCard' : 'srcCash')}</span>` : ''}</span></span><span class="amt num">+${fmt(amt(e))} <small>${S.base}</small><span class="b">${subAmt(e)}</span></span></button>`;

    const who = e.paidBy === 'fund' ? (ad > 0 ? t('fromFundPlus', money(amt(e) - ad), esc(mname(e.adv.by)), money(ad)) : t('fromFund')) : t('advanced', esc(mname(e.paidBy)));
    const split = all ? t('splitN', S.members.length) : (e.split || []).length === 1 ? t('alone', esc(mname(e.split[0]))) : t('splitN', (e.split || []).map(mname).map(esc).join('/'));
    return `<button class="entry ${e.paidBy === 'fund' && e.src === 'card' ? 'src-card' : e.paidBy === 'fund' && e.src === 'cash' ? 'src-cash' : ''}" data-id="${e.id}">${selMode ? `<span class="ic ck ${selIds.has(e.id) ? 'on' : ''}">\u2713</span>` : `<span class="ic">${svgIcon(cat.icon)}</span>`}<span><span class="t">${esc(e.note || catName(cat))}</span><span class="m">${who} · ${split}${e.paidBy === 'fund' && e.src ? ` <span class="pill src-${e.src}">${t(e.src === 'card' ? 'srcCard' : 'srcCash')}</span>` : ''}${e.paidBy !== 'fund' || ad > 0 ? ` <span class="pill warn">${t('reimburse')}</span>` : ''}</span></span><span class="amt num">−${fmt(amt(e))} <small>${S.base}</small><span class="b">${subAmt(e)}</span></span></button>`;
  }

  // ---------- my slice (personal spending, never part of the fund) ----------
  function calcMine() {
    const r = { total: 0, byCat: {}, bySrc: { cash: 0, card: 0 }, hasCard: false, n: 0 };
    (S.mine || []).forEach(e => {
      const a = amt(e);
      r.total += a; r.n++;
      r.byCat[e.cat] = (r.byCat[e.cat] || 0) + a;
      r.bySrc[e.src === 'card' ? 'card' : 'cash'] += a;
      if (e.src === 'card') r.hasCard = true;
    });
    return r;
  }

  async function fbInit() {
    if (db) return true;
    const [appMod, authMod, fsMod] = await Promise.all([
      import(OW.sdk + 'firebase-app.js'),
      import(OW.sdk + 'firebase-auth.js'),
      import(OW.sdk + 'firebase-firestore.js')
    ]);
    AU = authMod; FS = fsMod;
    const app = appMod.initializeApp(OW.fb);
    auth = AU.getAuth(app);
    db = FS.getFirestore(app);
    const cred = await AU.signInAnonymously(auth);
    myUid = cred.user.uid;
    return true;
  }

  const packS = () => { const o = JSON.parse(JSON.stringify(S)); delete o.tripCode; delete o.adminName; return JSON.stringify(o); };

  async function pushNow() {
    if (MEMBER || !S.tripCode || !db) return;
    syncing = true; updateBar();
    try {
      await FS.updateDoc(FS.doc(db, 'trips', S.tripCode), {
        S: packS(), adminMemberId: S.meId || '', adminName: adminName(), at: Date.now()
      });
      lastAt = Date.now();
    } catch (e) {
      toast(t('shSyncErr'));
      clearTimeout(pushT); pushT = setTimeout(pushNow, 20000);
    }
    syncing = false; updateBar();
  }
  window.__ppQueuePush = () => { if (MEMBER || !S.tripCode) return; clearTimeout(pushT); pushT = setTimeout(pushNow, 900); };

  function adopt(d) {
    let o = null;
    try { o = JSON.parse(d.S); } catch (e) { return; }
    if (!o || !o.members || !o.entries) return;
    const lang = S.lang, pal = S.palette;
    S = migrate(o);
    S.lang = lang; S.palette = pal;
    S.tripCode = d.__code; S.adminName = d.adminName || '';
    lastAt = d.at || Date.now();
    applyPalette(); applyLang(); renderAll(); updateBar();
  }
  async function pullOnce() {
    if (!db || !S.tripCode) return;
    try {
      const snap = await FS.getDoc(FS.doc(db, 'trips', S.tripCode));
      if (!snap.exists()) { toast(t('shGone')); return; }
      const d = snap.data(); d.__code = S.tripCode;
      if ((d.at || 0) >= lastAt) adopt(d); else updateBar();
    } catch (e) { toast(t('shNoNet')); }
  }
  function listen(code) {
    if (unsub) unsub();
    unsub = FS.onSnapshot(FS.doc(db, 'trips', code), (snap) => {
      if (!snap.exists()) { toast(t('shGone')); return; }
      const d = snap.data(); d.__code = code;
      if ((d.at || 0) > lastAt) adopt(d);
    }, () => {});
  }

  // ---------- share card in settings ----------
  const shareCard = document.createElement('div');
  shareCard.className = 'card pp-hide-member';
  shareCard.innerHTML =
    '<div class="set"><h3 id="shTitle"></h3><p id="shHint"></p>' +
    '<div id="shOffBox"><div class="actions" style="margin-top:10px"><button class="btn ghost small" id="shOnBtn"></button></div></div>' +
    '<div id="shOnBox" style="display:none">' +
    '<div class="hint" id="shCodeLbl" style="margin-top:8px"></div>' +
    '<div class="sh-code" id="shCodeVal">—</div>' +
    '<div class="hint" id="shAdminLbl"></div>' +
    '<div class="actions" style="margin-top:10px"><button class="btn ghost small" id="shOffBtn"></button><button class="btn primary small" id="shCopyBtn"></button></div>' +
    '</div></div>';
  (function () {
    const setView = document.getElementById('v-set');
    const histHead = setView.querySelector('[data-i="history"]');
    const anchor = histHead ? histHead.closest('.section-h') : null;
    if (anchor) setView.insertBefore(shareCard, anchor); else setView.appendChild(shareCard);
    const pal = document.getElementById('palSeg');
    if (pal && pal.closest('.card')) pal.closest('.card').classList.add('pp-keep');
  })();

  function renderShare() {
    document.getElementById('shTitle').textContent = t('shTitle');
    document.getElementById('shHint').textContent = t('shHint');
    document.getElementById('shOnBtn').textContent = t('shOn');
    document.getElementById('shOffBtn').textContent = t('shOff');
    document.getElementById('shCopyBtn').textContent = t('shCopy');
    document.getElementById('shCodeLbl').textContent = t('shCode');
    document.getElementById('shAdminLbl').textContent = t('shAdminIs', adminName() || '—');
    const on = !!S.tripCode;
    document.getElementById('shOnBox').style.display = on ? '' : 'none';
    document.getElementById('shOffBox').style.display = on ? 'none' : '';
    document.getElementById('shCodeVal').textContent = S.tripCode || '—';
    updateBar();
  }

  document.getElementById('shOnBtn').onclick = async () => {
    if (!S.meId) { toast(t('shNeedMe')); return; }
    try {
      await fbInit();
      const code = genCode();
      await FS.setDoc(FS.doc(db, 'trips', code), {
        adminUid: myUid, adminMemberId: S.meId, adminName: adminName(),
        S: packS(), at: Date.now(), created: Date.now()
      });
      S.tripCode = code; lastAt = Date.now(); save(); renderShare();
      copyLink();
    } catch (e) { toast(t('shNoNet')); }
  };
  document.getElementById('shOffBtn').onclick = () => {
    if (!confirm(t('shOffConfirm'))) return;
    const code = S.tripCode;
    S.tripCode = null; save(); renderShare();
    if (unsub) { unsub(); unsub = null; }
    if (db && code) FS.updateDoc(FS.doc(db, 'trips', code), { S: '', at: Date.now() }).catch(() => {});
    toast(t('shOffDone'));
  };
  document.getElementById('shCopyBtn').onclick = () => copyLink();
  function copyLink() {
    const url = tripLink(S.tripCode);
    const done = () => toast(t('shCopied'));
    if (navigator.share) { navigator.share({ url }).then(done).catch(() => {}); return; }
    if (navigator.clipboard) { navigator.clipboard.writeText(url).then(done).catch(() => prompt('', url)); return; }
    prompt('', url);
  }

  // ---------- import from the original PiePot ----------
  function askImport() {
    let old = null;
    try { const raw = localStorage.getItem(OW.oldKey); if (raw) old = JSON.parse(raw); } catch (e) {}
    if (!old || !old.members || !old.entries || !old.entries.length) return false;
    const sh = document.createElement('div');
    sh.className = 'sheet'; sh.id = 'impSheet';
    sh.innerHTML = '<div class="grab"></div><h2>' + t('impTitle') + '</h2><p class="hint">' +
      t('impHint', old.trip || '—') + '</p><div class="actions">' +
      '<button class="btn ghost" id="impNo"></button><button class="btn primary" id="impYes"></button></div>';
    document.body.appendChild(sh);
    sh.querySelector('#impNo').textContent = t('impNo');
    sh.querySelector('#impYes').textContent = t('impYes');
    const close = () => { unlockScroll(); sh.classList.remove('on'); document.getElementById('scrim').classList.remove('on'); setTimeout(() => sh.remove(), 300); };
    sh.querySelector('#impNo').onclick = close;
    sh.querySelector('#impYes').onclick = () => {
      S = migrate(old); S.tripCode = null; save();
      applyPalette(); applyLang(); renderAll(); renderShare();
      close(); toast(t('impDone'));
    };
    showSheet('impSheet');
    return true;
  }

  function afterStart(fn) {
    const el = document.getElementById('startScreen');
    if (!el || el.classList.contains('hide')) { fn(); return; }
    const h = () => setTimeout(fn, 500);
    document.getElementById('startGo').addEventListener('click', h, { once: true });
    document.getElementById('startAlt').addEventListener('click', h, { once: true });
  }

  // ---------- AI receipt scan ----------
  const CAT_MAP = { travel: 'transport', transport: 'transport', fun: 'activity', activity: 'activity', food: 'food', stay: 'stay', ticket: 'ticket', shop: 'shop', shopping: 'shopping', other: 'other' };
  const scanBtn = document.createElement('button');
  scanBtn.type = 'button'; scanBtn.className = 'btn ghost small'; scanBtn.id = 'scanBtn';
  scanBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V6a1 1 0 0 1 1-1h3M17 5h3a1 1 0 0 1 1 1v3M21 15v3a1 1 0 0 1-1 1h-3M7 19H4a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3"/></svg><span id="scanBtnTxt"></span>';
  const scanInput = document.createElement('input');
  scanInput.type = 'file'; scanInput.accept = 'image/*'; scanInput.setAttribute('capture', 'environment'); scanInput.hidden = true;
  (function () {
    const conv = document.getElementById('fConv');
    conv.parentNode.insertBefore(scanBtn, conv.nextSibling);
    document.body.appendChild(scanInput);
  })();
  scanBtn.onclick = () => { scanInput.value = ''; scanInput.click(); };
  scanInput.onchange = () => { const f = scanInput.files && scanInput.files[0]; if (f) doScan(f); };

  function shrink(file) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1500, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }
  async function doScan(file) {
    if (!PIN) { const p = prompt(t('scanPin')); if (!p) return; PIN = p.trim(); }
    toast(t('scanning'));
    let b64;
    try { b64 = await shrink(file); } catch (e) { toast(t('scanFail')); return; }
    let r, d;
    try {
      r = await fetch(OW.scan, { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': PIN }, body: JSON.stringify({ image: b64, media_type: 'image/jpeg' }) });
      d = await r.json();
    } catch (e) { toast(t('shNoNet')); return; }
    if (r.status === 401) { PIN = ''; try { localStorage.removeItem(OW.pinKey); } catch (e) {} toast(t('scanBadPin')); return; }
    if (r.status === 429) { toast(t('scanLimit')); return; }
    if (!d || !d.ok || !d.result || d.result.amount == null) { toast(t('scanFail')); return; }
    try { localStorage.setItem(OW.pinKey, PIN); } catch (e) {}
    applyScan(d.result);
  }
  function applyScan(x) {
    if (isFinite(x.amount) && x.amount > 0) setAmt(x.amount);
    const cur = String(x.cur || '').toUpperCase();
    if (CUR[cur] || (S.cur && S.cur[cur])) F.cur = cur;
    if (x.note) document.getElementById('fNote').value = String(x.note).slice(0, 40);
    const cat = CAT_MAP[x.cat];
    if (cat && CATS.some(c => c.id === cat)) {
      if (F.mode === 'mine' || !CATS.find(c => c.id === cat).mine) F.cat = cat;
    }
    if (/^\d{4}-\d{2}-\d{2}$/.test(x.date || '')) document.getElementById('fDate').value = x.date;
    renderForm();
    toast(x.confidence != null && x.confidence < 0.6 ? t('scanLow') : t('scanOk'));
  }

  // ---------- boot ----------
  window.__ppOwnerLang = () => { renderShare(); document.getElementById('scanBtnTxt').textContent = t('scanBtn'); };

  (async function ownerBoot() {
    document.getElementById('scanBtnTxt').textContent = t('scanBtn');
    const urlCode = new URLSearchParams(location.search).get('t');

    if (urlCode) {
      toast(t('shLoading'));
      try {
        await fbInit();
        const snap = await FS.getDoc(FS.doc(db, 'trips', urlCode));
        if (!snap.exists()) { toast(t('shGone')); renderShare(); return; }
        const d = snap.data(); d.__code = urlCode;
        if (d.adminUid === myUid) {
          S.tripCode = urlCode; save();
          if (d.S) adopt(d);
          renderShare();
        } else {
          MEMBER = true; window.__ppMember = true;
          document.body.classList.add('pp-member');
          adopt(d);
          listen(urlCode);
          showView('sum');
        }
      } catch (e) { toast(t('shNoNet')); }
      renderShare();
      return;
    }

    if (S.tripCode) {
      try { await fbInit(); listen(S.tripCode); await pullOnce(); } catch (e) {}
    } else if (!S.entries.length) {
      afterStart(askImport);
    }
    renderShare();
  })();

  // ---------- first run ----------
  applyLang();
  renderAll();
  if (!window.__ppMember && !S.tripCode && !S.entries.length && S.members.length === 2 && S.members.every((m, i) => m.name === 'AB'[i])) {
    showView('set');
    toast(t('firstRun'));
  }
})();
</script>
<script>
  // service worker: register, check for updates, and auto-reload when a new version takes over
  if ('serviceWorker' in navigator) {
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return; reloading = true; location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update();
        if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) sw.postMessage('SKIP_WAITING');
          });
        });
        setInterval(() => reg.update(), 60 * 60 * 1000);
      }).catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    });
  }
</script>
</body>
